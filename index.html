<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto Web</title>
</head>
<body>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#proyectos">Proyectos</a>
        <a href="#sobre-mi">Sobre mí</a>
        <a href="#contacto">Contacto</a>
    </nav>
    <h1>Bienvenido/a a mi sitio web</h1>
    <p>Este es un proyecto para aprender Git y GitHub.</p>

    <div id="contact">
        <form action="">
            <h1>Contacto</h1>

            <div>
                <span>Nombre:</span>
                <input type="text" name="contacto_nombre">
            </div>
            
            <div>
                <span>E-mail:</span>
                <input type="email" name="contacto_email">
            </div>
            
            <div>
                <span>Mensaje:</span>
                <textarea name="contacto_mensaje" id="contacto_mensaje"></textarea>
            </div>

            <button type="submit">Enviar mensaje</button>
        </form>
    </div>
</body>
</html>
